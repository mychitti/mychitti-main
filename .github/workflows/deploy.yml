name: Deploy to All Server

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: admin 
            host: 64.227.158.127
            path: /var/www/html/admin

          - name: vendor
            host: 167.71.233.92
            path: /var/www/html/vendor

          - name: shop
            host: 64.227.178.210
            path: /var/www/html/mychitti

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ matrix.host }} >> ~/.ssh/known_hosts

    - name: Deploy Code to ${{ matrix.name }} Server
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ matrix.host }} "
        set -e && \
        cd ${{ matrix.path }} && \

        echo 'Fetching latest code...' && \
        git fetch origin && \
        git merge --ff-only origin/main && \

        php artisan config:clear && \
        php artisan route:clear && \
        php artisan view:clear && \
        php artisan cache:clear && \
        php artisan config:cache && \

        echo 'Restarting queue workers...' && \
        php artisan queue:restart && \

        echo 'Deployment completed successfully!'
        "
 

