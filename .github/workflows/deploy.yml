name: Deploy to All Server

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: admin
            host: 64.227.158.127
            path: /var/www/html/admin

          - name: vendor
            host: 167.71.233.92
            path: /var/www/html/vendor

          - name: shop
            host: 64.227.178.210
            path: /var/www/html/mychitti

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ matrix.host }} >> ~/.ssh/known_hosts

    - name: Deploy Code to ${{ matrix.name }} Server
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ matrix.host }} "
        set -e && \
        cd ${{ matrix.path }} && \

        echo 'Preserving server composer files...' && \
        cp composer.json /tmp/composer.json.bak || true && \
        cp composer.lock /tmp/composer.lock.bak || true && \

        echo 'Fetching latest code...' && \
        git fetch origin && \
        git reset --hard origin/main && \

        echo 'Restoring server composer files...' && \
        mv /tmp/composer.json.bak composer.json || true && \
        mv /tmp/composer.lock.bak composer.lock || true && \

        php artisan config:clear && \
        php artisan route:clear && \
        php artisan view:clear && \
        php artisan cache:clear && \
        php artisan config:cache && \
        php artisan view:cache && \

        mkdir -p storage/app/tmp && \
        chown -R apache:apache storage/app/tmp && \
        chmod -R 775 storage/app/tmp && \

        mkdir -p storage/app/mpdf_temp && \
        chown -R apache:apache storage/app/mpdf_temp && \
        chmod -R 775 storage/app/mpdf_temp && \
        
        semanage fcontext -a -t httpd_sys_rw_content_t '${{ matrix.path }}/storage/app/tmp(/.*)?' && \
        semanage fcontext -a -t httpd_sys_rw_content_t '${{ matrix.path }}/storage/app/mpdf_temp(/.*)?' && \

        restorecon -Rv ${{ matrix.path }}/storage/app/tmp && \
        restorecon -Rv ${{ matrix.path }}/storage/app/mpdf_temp && \

        chown -R apache:apache storage/framework storage/logs bootstrap/cache && \
        chmod -R 775 storage/framework storage/logs bootstrap/cache && \

        echo 'Deployment completed successfully!'
        "
