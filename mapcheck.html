<!DOCTYPE html>
<html>
<head>
    <title>Draw Polygon Around a Location</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCzWjsogpt6Ax0qDhvVq6NXVjRsYkictKQ"></script>
    <script>
        function initialize() {
            var geocoder = new google.maps.Geocoder();
            var address = '110094'; // Replace with your location

            geocoder.geocode({ 'address': address }, function(results, status) {
                if (status == google.maps.GeocoderStatus.OK) {
                    var mapOptions = {
                        center: results[0].geometry.location,
                        zoom: 12
                    };
                    var map = new google.maps.Map(document.getElementById('map'), mapOptions);

                    // Get the bounds of the location
                    var bounds = results[0].geometry.viewport;

                    // Define the LatLng coordinates for the polygon's path
                    var polygonCoords = [
                        bounds.getNorthEast(), // Top-right
                        { lat: bounds.getNorthEast().lat(), lng: bounds.getSouthWest().lng() }, // Top-left
                        bounds.getSouthWest(), // Bottom-left
                        { lat: bounds.getSouthWest().lat(), lng: bounds.getNorthEast().lng() } // Bottom-right
                    ];

                    // Construct the polygon
                    var polygon = new google.maps.Polygon({
                        paths: polygonCoords,
                        strokeColor: '#FF0000',
                        strokeOpacity: 0.8,
                        strokeWeight: 2,
                        fillColor: '#FF0000',
                        fillOpacity: 0.35
                    });

                    // Display the polygon on the map
                    polygon.setMap(map);

                    // Optionally, fit the map to the polygon
                    map.fitBounds(bounds);
                } else {
                    alert('Geocode was not successful for the following reason: ' + status);
                }
            });
        }

        google.maps.event.addDomListener(window, 'load', initialize);

        
    </script>
</head>
<body>
    <div id="map" style="height: 500px; width: 100%;"></div>
</body>
</html>
